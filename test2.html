<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>櫃台叫號系統</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            justify-content: center;
        }

        .panel {
            background: #333;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 20px 0;
            color: #aaa;
            font-size: 1.2rem;
        }

        .number-display {
            font-size: 6rem;
            font-weight: bold;
            color: #4caf50;
            line-height: 1;
        }

        .name-display {
            font-size: 2rem;
            margin: 10px 0 30px 0;
            color: #fff;
            height: 50px;
        }

        /* 固定高度避免跳動 */

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #888;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-next {
            background: #2196f3;
            color: white;
        }

        .btn-next:hover {
            background: #1976d2;
        }

        .btn-next:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #d32f2f;
            color: white;
            flex: 0.5;
        }
    </style>
</head>

<body>

    <div class="panel">
        <h1>櫃台服務窗口</h1>

        <div class="info-bar">
            <span>等待人數: <strong id="waiting-count" style="color:#ff9800">0</strong></span>
            <span>總取號數: <span id="max-count">0</span></span>
        </div>

        <div class="number-display" id="current-num">0</div>
        <div class="name-display" id="current-name">---</div>

        <div class="btn-group">
            <button class="btn-reset" id="btn-reset">重置</button>
            <button class="btn-next" id="btn-next">叫下一號 🔔</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, get, update, set }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- 請貼上你的 Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDnQEorAx3Ld2Pi3AF9lfdDeO6i5FYlZpo",
            authDomain: "queue-6b0e1.firebaseapp.com",
            databaseURL: "https://queue-6b0e1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "queue-6b0e1",
            storageBucket: "queue-6b0e1.firebasestorage.app",
            messagingSenderId: "209096503140",
            appId: "1:209096503140:web:4fef89cd385fa7258e5471"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const elCurrentNum = document.getElementById('current-num');
        const elCurrentName = document.getElementById('current-name');
        const elWaiting = document.getElementById('waiting-count');
        const elMax = document.getElementById('max-count');
        const btnNext = document.getElementById('btn-next');
        const btnReset = document.getElementById('btn-reset');

        let currentStatus = { current: 0, max: 0 };
        let tickets = {};

        // 1. 監聽狀態 (status)
        onValue(ref(db, 'status'), (snapshot) => {
            currentStatus = snapshot.val() || { current: 0, max: 0 };
            updateUI();
        });

        // 2. 監聽所有票券資訊 (tickets) - 為了拿到名字
        onValue(ref(db, 'tickets'), (snapshot) => {
            tickets = snapshot.val() || {};
            updateUI();
        });

        function updateUI() {
            const { current, max } = currentStatus;
            const waiting = max - current;

            elCurrentNum.innerText = current;
            elMax.innerText = max;
            elWaiting.innerText = waiting > 0 ? waiting : 0;

            // 顯示目前名字
            if (current > 0 && tickets[current]) {
                elCurrentName.innerText = tickets[current];
            } else if (current === 0) {
                elCurrentName.innerText = "準備中";
            } else {
                elCurrentName.innerText = "無資料";
            }

            // 如果沒人等待，禁用按鈕
            btnNext.disabled = (current >= max);
            if (btnNext.disabled) {
                btnNext.innerText = "目前無人";
            } else {
                btnNext.innerText = "叫下一號 🔔";
            }
        }

        // 叫號功能
        btnNext.addEventListener('click', () => {
            const nextNum = currentStatus.current + 1;
            if (nextNum > currentStatus.max) return;

            // 更新資料庫
            update(ref(db, 'status'), {
                current: nextNum
            });

            // 語音播報
            const name = tickets[nextNum] || "來賓";
            speak(`請 ${nextNum} 號，${name}，到櫃台`);
        });

        // 重置功能
        btnReset.addEventListener('click', () => {
            if (confirm("確定要清空所有資料並重置號碼嗎？")) {
                set(ref(db), {
                    status: { current: 0, max: 0 },
                    tickets: {}
                });
            }
        });

        // 語音合成函式
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; // 設定為中文
            utterance.rate = 0.9;     // 語速稍慢
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>

</html>
